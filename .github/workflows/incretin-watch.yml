name: Incretin market watch

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window (1-366 days)'
        required: true
        default: '14'
        type: string
      persist_reports:
        description: 'Commit reports and deduplication state (main branch only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: incretin-watch-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: incretin-watch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: incretin-watch/pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Test evidence and deduplication behavior
        run: python -m unittest discover -s tests -v
      - name: Collect and report
        id: collect
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        run: |
          # Do not upload previous-run aliases if the new collection fails.
          rm -f reports/latest.md reports/latest.json reports/latest.csv reports/coverage.json
          incretin-watch --lookback-days "$LOOKBACK_DAYS" --analysis rules
      - name: Show report
        if: steps.collect.outcome == 'success'
        run: head -c 900000 reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and source health
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: incretin-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            incretin-watch/reports/latest.*
            incretin-watch/reports/coverage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist reports and deduplication state
        if: steps.collect.outcome == 'success' && inputs.persist_reports && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports state/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update incretin watch report and deduplication state [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
