name: Incretin market watch

on:
  schedule:
    # UTC 00:17 = Asia/Shanghai 08:17. GitHub schedules may be delayed.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window (1-366 days)'
        required: true
        default: '14'
        type: string
  push:
    branches: [main]
    paths:
      - 'incretin-watch/src/**'
      - 'incretin-watch/config.json'
      - 'incretin-watch/pyproject.toml'
      - '.github/workflows/incretin-watch.yml'

permissions:
  contents: write

concurrency:
  group: incretin-watch-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: incretin-watch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: incretin-watch/pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Test evidence and deduplication behavior
        run: python -m unittest discover -s tests -v
      - name: Collect and report
        id: collect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        run: incretin-watch --lookback-days "$LOOKBACK_DAYS" --analysis auto
      - name: Show report
        if: steps.collect.outcome == 'success'
        run: head -c 900000 reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incretin-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            incretin-watch/reports/latest.*
            incretin-watch/reports/coverage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist reports and deduplication state
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports state/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update incretin watch report and deduplication state [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
